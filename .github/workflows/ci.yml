name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Dependency health
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q src scripts tests run_cli.py run_gui.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m jobsearch_assistant --help
      - name: One-click Windows launcher smoke test
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: cmd
        env:
          JOBSEARCH_PREPARE_ONLY: "1"
          JOBSEARCH_NONINTERACTIVE: "1"
        run: START_WINDOWS.bat
      - name: One-click Linux launcher smoke test
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        env:
          JOBSEARCH_PREPARE_ONLY: "1"
          JOBSEARCH_NONINTERACTIVE: "1"
        run: bash START_LINUX.sh
